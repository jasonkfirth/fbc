# Project: FreeBASIC XL
# ---------------------
#
# File: .github/workflows/packages.yml
#
# Purpose:
#
#     Build installable FreeBASIC XL packages from the repository's existing
#     package workflows and preserve them as Actions artifacts or release
#     assets.
#
# Responsibilities:
#
#     * build Debian/Ubuntu, Windows, macOS, and MIPS package sets
#     * retain successful package output for manual download
#     * attach package files to version-tagged GitHub Releases
#
# This file intentionally does NOT contain:
#
#     * compiler or runtime implementation
#     * package-format implementation
#     * publishing credentials other than the scoped GitHub token

name: FreeBASIC XL packages

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      full_linux_matrix:
        description: Build the complete Linux distro and architecture matrix
        required: true
        default: false
        type: boolean

concurrency:
  group: fbc-xl-packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BOOTSTRAP_VERSION: "1.10.1"

jobs:
  linux-debian:
    name: Debian package
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.full_linux_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install package build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl rsync tar xz-utils gzip dos2unix \
            build-essential pkg-config dpkg-dev debhelper devscripts fakeroot \
            lintian quilt python3 git

      - name: Seed host compiler bootstrap sources
        run: bash build_scripts/ci-seed-source-bootstrap.sh linux-x86_64 linux-x86_64

      - name: Build Debian package
        env:
          BUILDROOT: ${{ runner.temp }}/debian-build
          WORKDIR: ${{ runner.temp }}/debian-build/work
          OUTBASE: ${{ runner.temp }}/packages
          FBC_PACKAGE_OUTDIR: ${{ runner.temp }}/packages/debian
          JOBS: 4
        run: |
          set -euo pipefail
          # Sidecar SDKs have dedicated package lanes below. Keep this job
          # focused on the native Debian/Ubuntu compiler package.
          bash build_scripts/debianubuntu-build-freebasic.sh \
            --no-js \
            --no-android \
            --no-wii

      - name: Upload Debian packages
        uses: actions/upload-artifact@v7
        with:
          name: fbc-xl-packages-linux-debian
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/packages/debian/

  linux-release-matrix:
    name: Linux ${{ matrix.name }} package
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full_linux_matrix) }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { name: ubuntu-resolute-amd64, family: debian, distro: ubuntu, release: resolute, arch: amd64 }
          - { name: ubuntu-resolute-arm64, family: debian, distro: ubuntu, release: resolute, arch: arm64 }
          - { name: ubuntu-resolute-armhf, family: debian, distro: ubuntu, release: resolute, arch: armhf }
          - { name: ubuntu-resolute-ppc64el, family: debian, distro: ubuntu, release: resolute, arch: ppc64el }
          - { name: ubuntu-resolute-s390x, family: debian, distro: ubuntu, release: resolute, arch: s390x }
          - { name: ubuntu-resolute-riscv64, family: debian, distro: ubuntu, release: resolute, arch: riscv64 }
          - { name: debian-trixie-amd64, family: debian, distro: debian, release: trixie, arch: amd64 }
          - { name: debian-trixie-arm64, family: debian, distro: debian, release: trixie, arch: arm64 }
          - { name: debian-trixie-armhf, family: debian, distro: debian, release: trixie, arch: armhf }
          - { name: debian-trixie-ppc64el, family: debian, distro: debian, release: trixie, arch: ppc64el }
          - { name: debian-trixie-s390x, family: debian, distro: debian, release: trixie, arch: s390x }
          - { name: debian-trixie-riscv64, family: debian, distro: debian, release: trixie, arch: riscv64 }
          - { name: debian-trixie-armel, family: debian, distro: debian, release: trixie, arch: armel }
          - { name: debian-trixie-loong64, family: debian, distro: debian, release: trixie, arch: loong64 }
          - { name: debian-sid-amd64, family: debian, distro: debian, release: sid, arch: amd64 }
          - { name: debian-sid-arm64, family: debian, distro: debian, release: sid, arch: arm64 }
          - { name: debian-sid-armhf, family: debian, distro: debian, release: sid, arch: armhf }
          - { name: debian-sid-ppc64el, family: debian, distro: debian, release: sid, arch: ppc64el }
          - { name: debian-sid-s390x, family: debian, distro: debian, release: sid, arch: s390x }
          - { name: debian-sid-riscv64, family: debian, distro: debian, release: sid, arch: riscv64 }
          - { name: raspbian-trixie-armhf, family: debian, distro: raspbian, release: trixie, arch: armhf }
          - { name: alpine-3_24-x86_64, family: alpine, distro: alpine, release: '3.24', arch: x86_64 }
          - { name: alpine-3_24-aarch64, family: alpine, distro: alpine, release: '3.24', arch: aarch64 }
          - { name: alpine-3_24-armv7, family: alpine, distro: alpine, release: '3.24', arch: armv7 }
          - { name: alpine-3_24-ppc64le, family: alpine, distro: alpine, release: '3.24', arch: ppc64le }
          - { name: alpine-3_24-s390x, family: alpine, distro: alpine, release: '3.24', arch: s390x }
          - { name: alpine-3_24-riscv64, family: alpine, distro: alpine, release: '3.24', arch: riscv64 }
          - { name: alpine-edge-x86_64, family: alpine, distro: alpine, release: edge, arch: x86_64 }
          - { name: alpine-edge-aarch64, family: alpine, distro: alpine, release: edge, arch: aarch64 }
          - { name: alpine-edge-armv7, family: alpine, distro: alpine, release: edge, arch: armv7 }
          - { name: alpine-edge-ppc64le, family: alpine, distro: alpine, release: edge, arch: ppc64le }
          - { name: alpine-edge-s390x, family: alpine, distro: alpine, release: edge, arch: s390x }
          - { name: alpine-edge-riscv64, family: alpine, distro: alpine, release: edge, arch: riscv64 }
          - { name: postmarketos-edge-x86_64, family: alpine, distro: postmarketos, release: edge, arch: x86_64 }
          - { name: postmarketos-edge-aarch64, family: alpine, distro: postmarketos, release: edge, arch: aarch64 }
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux matrix host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-user-static binfmt-support \
            ca-certificates curl wget git \
            build-essential make pkg-config rsync \
            tar xz-utils gzip zip unzip dos2unix \
            jq python3 perl bc

          # Hosted runners already provide Docker Engine and containerd.io.
          # Installing Ubuntu's docker.io package would replace that runtime
          # and conflicts with the runner's containerd.io package.
          docker version

      - name: Seed host compiler bootstrap sources
        run: bash build_scripts/ci-seed-source-bootstrap.sh linux-x86_64 linux-x86_64

      - name: Build the current host compiler
        run: |
          set -euo pipefail
          host_feature_args=(
            DISABLE_FFI=YesPlease
            DISABLE_GPM=YesPlease
            DISABLE_NCURSES=YesPlease
            DISABLE_X11=YesPlease
            DISABLE_OPENGL=YesPlease
            DISABLE_ALSA=YesPlease
            DISABLE_PULSE=YesPlease
          )
          make -j4 bootstrap-minimal "${host_feature_args[@]}" </dev/null
          make -j4 compiler \
            BUILD_FBCFLAGS="-d __FB_BOOTSTRAP_COMPAT__" \
            "${host_feature_args[@]}" </dev/null
          make clean-compiler
          make -j4 compiler "${host_feature_args[@]}" </dev/null

      - name: Build Linux package row
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
          MATRIX_DISTRO: ${{ matrix.distro }}
          MATRIX_FAMILY: ${{ matrix.family }}
          MATRIX_RELEASE: ${{ matrix.release }}
          JOBS: 4
        run: |
          set -euo pipefail
          if [[ "$MATRIX_FAMILY" == "debian" ]]; then
            bash build_scripts/debianubuntu-build-freebasic-matrix.sh \
              --distro "$MATRIX_DISTRO" \
              --release "$MATRIX_RELEASE" \
              --arch "$MATRIX_ARCH" \
              --jobs 4 \
              --skip-host-deps
          else
            bash build_scripts/alpine-freebasic-matrix-build.sh \
              --distro "$MATRIX_DISTRO" \
              --release "$MATRIX_RELEASE" \
              --arch "$MATRIX_ARCH" \
              --jobs 4 \
              --skip-host-deps
          fi

      - name: Upload Linux package row
        uses: actions/upload-artifact@v7
        with:
          name: fbc-xl-linux-package-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            out/linux/
            out/raspbian/

      - name: Upload Linux row diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: fbc-xl-linux-diagnostic-${{ matrix.name }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            out/linux/**/docker_build.log
            out/raspbian/**/docker_build.log

  windows:
    name: Windows package matrix
    runs-on: windows-latest
    timeout-minutes: 240

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            git
            curl
            rsync
            tar
            xz
            gzip
            pkgconf
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-libffi

      - name: Seed Windows package bootstrap sources
        run: |
          bash build_scripts/ci-seed-source-bootstrap.sh win32 win64
          bash build_scripts/ci-seed-source-bootstrap.sh win64 win64
          bash build_scripts/ci-seed-source-bootstrap.sh win32-aarch64 win64

      - name: Build the Windows host compiler
        run: |
          make -j"$(nproc)" bootstrap-minimal </dev/null
          make -j"$(nproc)" compiler BUILD_FBCFLAGS="-d __FB_BOOTSTRAP_COMPAT__" </dev/null
          make clean-compiler
          make -j"$(nproc)" compiler </dev/null

      - name: Build Windows, Android, JavaScript, Xbox, and DOS packages
        env:
          JOBS: 4
          HOST_FBC_ROOT: ${{ github.workspace }}
        run: |
          # devkitPro asks CI users to consume its Docker images instead of
          # synchronizing the pacman repositories. The tagged Linux matrix
          # builds freebasic-wii from the pinned official devkitPPC image.
          bash build_scripts/msys2-build-freebasic-matrix.sh --no-wii

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: fbc-xl-packages-windows
          if-no-files-found: error
          retention-days: 30
          path: |
            out/mingw32*/
            out/msdos/

  macos:
    name: macOS package matrix
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Seed Darwin package bootstrap sources
        run: |
          bash build_scripts/ci-seed-source-bootstrap.sh darwin-aarch64 linux-x86_64
          bash build_scripts/ci-seed-source-bootstrap.sh darwin-x86_64 linux-x86_64

      - name: Build macOS arm64 and x86_64 packages
        env:
          BUILDROOT: ${{ runner.temp }}/macos-build
          OUTBASE: ${{ runner.temp }}/packages/macos
          JOBS: 4
        run: bash build_scripts/macos-build-freebasic.sh --arch all

      - name: Upload macOS packages
        uses: actions/upload-artifact@v7
        with:
          name: fbc-xl-packages-macos
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/packages/macos/

  mips:
    name: MIPS package matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install MIPS package workflow dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync curl
          docker version

      - name: Seed host bootstrap sources
        run: bash build_scripts/ci-seed-source-bootstrap.sh linux-x86_64 linux-x86_64

      - name: Build and qualify MIPS packages
        env:
          JOBS: 2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mips/output/work"
          bash build_scripts/debianubuntu-build-freebasic-mips.sh \
            --jobs 2 \
            --work-dir "$RUNNER_TEMP/mips/output/work" \
            --out-dir "$RUNNER_TEMP/mips/output"

      - name: Upload MIPS packages
        uses: actions/upload-artifact@v7
        with:
          name: fbc-xl-packages-mips
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/mips/output/

  publish-release:
    name: Publish tagged release packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux-release-matrix
      - windows
      - macos
      - mips
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download Linux package matrix
        uses: actions/download-artifact@v8
        with:
          pattern: fbc-xl-linux-package-*
          merge-multiple: true
          path: release-assets/linux-matrix

      - name: Download Windows packages
        uses: actions/download-artifact@v8
        with:
          name: fbc-xl-packages-windows
          path: release-assets/windows

      - name: Download macOS packages
        uses: actions/download-artifact@v8
        with:
          name: fbc-xl-packages-macos
          path: release-assets/macos

      - name: Download MIPS packages
        uses: actions/download-artifact@v8
        with:
          name: fbc-xl-packages-mips
          path: release-assets/mips

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "FreeBASIC XL $tag" \
              --generate-notes
          fi

          mapfile -d '' source_assets < <(
            find release-assets -type f \( \
              -name '*.deb' -o \
              -name '*.rpm' -o \
              -name '*.apk' -o \
              -name '*.zip' -o \
              -name '*.tar.xz' -o \
              -name '*.pkg' -o \
              -name '*-setup.exe' \
            \) -print0
          )
          [ "${#source_assets[@]}" -gt 0 ] || {
            echo "ERROR: no package files were downloaded" >&2
            exit 1
          }

          # GitHub Release assets share one flat namespace. Keep familiar
          # package names when they are unique, and qualify only duplicate
          # basenames with their matrix path so no distro replaces another.
          declare -A asset_name_counts=()
          for asset in "${source_assets[@]}"; do
            name="${asset##*/}"
            count="${asset_name_counts[$name]:-0}"
            asset_name_counts["$name"]=$((count + 1))
          done

          mkdir -p release-upload
          for asset in "${source_assets[@]}"; do
            name="${asset##*/}"
            upload_name="$name"

            if (( asset_name_counts["$name"] > 1 )); then
              relative="${asset#release-assets/}"
              qualifier="${relative%/*}"
              qualifier="${qualifier//\//-}"
              upload_name="${qualifier}-${name}"
            fi

            [ ! -e "release-upload/$upload_name" ] || {
              echo "ERROR: release asset name collision: $upload_name" >&2
              exit 1
            }
            cp -- "$asset" "release-upload/$upload_name"
          done

          mapfile -d '' assets < <(find release-upload -maxdepth 1 -type f -print0)

          gh release upload "$tag" "${assets[@]}" --clobber

# end of .github/workflows/packages.yml
